# Illustrative manifests on APIs removed in 1.16 and 1.25.
apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  labels:
    name: not-the-name
  name: web
spec:
  replicas: 2
---
apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: nightly
spec:
  schedule: '0 3 * * *'
---
apiVersion: v1
kind: Service
metadata:
  name: web
