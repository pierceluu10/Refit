# Single-tenant hosted worker. Secrets (never in this file): GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY,
# REFIT_WEBHOOK_SECRET, REFIT_SERVICE_TOKEN, REFIT_DATABASE_URL (Supabase, uselibpqcompat=true&sslmode=require),
# REFIT_HOSTED_OWNER, OPENAI_API_KEY and OPENAI_MODEL.
app = "refit-hosted"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  REFIT_AI_BUDGET_DIRECTORY = "/data/ai-budget"
  REFIT_AI_BUDGET_USD = "2"
  REFIT_HOSTED_FLAGS = "--publish-draft --ai-patch --repair-attempts 2"
  # Validation images named by approved .refit.json files; pulled on boot.
  REFIT_HOSTED_IMAGES = "node:22-alpine"

[mounts]
  source = "refit_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Jobs and lease renewals run between webhooks, so the worker must not idle-stop.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "4gb"
