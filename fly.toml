# Single-tenant hosted worker. Secrets (never in this file): GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY,
# REFIT_WEBHOOK_SECRET, REFIT_SERVICE_TOKEN, REFIT_DATABASE_URL (Supabase, uselibpqcompat=true&sslmode=require),
# REFIT_HOSTED_OWNER, OPENAI_API_KEY and OPENAI_MODEL.
app = "refit-hosted"
primary_region = "iad"
# Fly sends SIGINT, waits this long, then SIGTERM. The worker stops claiming on the first signal
# and stops the running job on the second; 300 seconds is Fly's maximum.
kill_timeout = 300

[build]
  dockerfile = "Dockerfile"

[env]
  REFIT_AI_BUDGET_DIRECTORY = "/data/ai-budget"
  # Push 279 AI (Pierce, 2026-10-25: use AI on the live drafts): L1's $10 less $0.38 spent and $5 kept
  # for the heldout-30 run, plus the $3 spare. One installation holds all 279 forks; the secret
  # REFIT_HOSTED_AI_BUDGET_USD is staged to the same value.
  REFIT_AI_BUDGET_USD = "7"
  # Push 279 (2026-10-24, board #300): engine only until 2026-10-25 07:00Z, then --ai-patch. The push ends by restoring
  # "--publish-draft --ai-patch --repair-attempts 2" and shared-cpu-2x with 4gb.
  # Eight forked job processes (Pierce, 2026-10-25: finish push 279 faster) keep /health answering while jobs scan; all 279 forks share one
  # installation, so its running-job limit matches. A target whose doctor stops reruns every
  # interval and counts against the 1440-job daily cap, so the worker polls hourly.
  REFIT_HOSTED_FLAGS = "--publish-draft --ai-patch --repair-attempts 2 --job-processes 8 --interval 3600"
  REFIT_HOSTED_INSTALLATION_JOBS = "8"
  # Validation images named by approved .refit.json files; pulled on boot.
  REFIT_HOSTED_IMAGES = "node:22-alpine stripe/stripe-mock:latest"
  # Prepared dependency bundles live on the volume, beside /data/docker and /data/state, not on the
  # 8 GB root disk they filled on 2026-10-25. Above the cap the least recently used are evicted after
  # each new bundle; four jobs can each stage one more archive (2 GiB at most), so the cache peaks
  # near 16 GiB of the volume.
  REFIT_DEPENDENCY_CACHE_DIRECTORY = "/data/dependencies"
  REFIT_DEPENDENCY_CACHE_GIB = "8"
  # Validation stages each archive in a temporary directory; four jobs could fill the root disk.
  TMPDIR = "/data/tmp"

[mounts]
  source = "refit_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Jobs and lease renewals run between webhooks, so the worker must not idle-stop.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# Dedicated CPUs keep oasdiff inside its 30-second limit (66-73% steal on shared-cpu-2x). Each job
# process takes up to 1.5 GiB of heap plus the 4 GiB sandbox profile's 5 GiB container, so four
# jobs need about 26 GiB; eight need about 52 GiB, so 64gb leaves room for the worker and dockerd.
[[vm]]
  size = "performance-16x"
  memory = "64gb"
