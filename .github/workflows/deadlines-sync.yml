name: Deadline registry sync

# Reads Anthropic's model deprecations page every day and opens a pull request when
# data/deadlines.json should change. Nothing is merged; a person reviews the pull request.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deadlines-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node bin/refit.mjs deadlines --sync anthropic --write
      - run: npm run deadlines:check
      - name: Open a pull request when the registry changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/deadlines.json; then
            echo "The registry already matches Anthropic's page."
            exit 0
          fi
          title='chore: sync Anthropic model deadlines'
          if [ -n "$(gh pr list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            echo 'A sync pull request is already open; review that one first.'
            exit 0
          fi
          branch="deadlines/anthropic-$(date -u +%Y-%m-%d)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -q -am "$title"
          git push -q origin "$branch"
          gh pr create --base main --head "$branch" --title "$title" --body "$(cat <<'BODY'
          Anthropic's [model deprecations page](https://platform.claude.com/docs/en/about-claude/model-deprecations) lists retirements that `data/deadlines.json` does not have yet, or with a different date or replacement. This pull request was opened by the scheduled `refit deadlines --sync anthropic` job.

          Before merging, compare each changed entry with the page. Entries the page no longer lists are kept, never deleted automatically. After merge, deadline checks, alerts and model replacements use the new dates.
          BODY
          )"
