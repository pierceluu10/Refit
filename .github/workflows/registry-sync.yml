name: Registry sync

# Reads Anthropic's deprecations page each day, and every provider's page when run by hand, and opens or updates one pull request from
# the registry-sync branch when data/deadlines.json should change. Nothing is merged; a person
# reviews the pull request. See docs/REGISTRY-SYNC.md.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: registry-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Push the registry-sync branch, then open or edit its pull request.
      contents: write
      pull-requests: write
    env:
      BRANCH: registry-sync
      BOT_NAME: github-actions[bot]
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      TITLE: 'chore(data): sync provider deadlines'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync every provider's page
        id: sync
        run: |
          failed=''
          # The scheduled run keeps syncing Anthropic only; the other providers' syncs are new and
          # run only when started by hand (owner decision, 2026-10-22: nothing new runs by default).
          providers='anthropic'
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            providers='anthropic openai gemini shopify meta-graph'
          fi
          for provider in $providers; do
            echo "== $provider" >> "$RUNNER_TEMP/sync.txt"
            if ! node bin/refit.mjs deadlines --sync "$provider" --write >> "$RUNNER_TEMP/sync.txt" 2>&1; then
              failed="$failed $provider"
            fi
          done
          cat "$RUNNER_TEMP/sync.txt"
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"
      - run: npm run deadlines:check
      - run: npm run deadlines:check-sources
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.sync.outputs.failed }}
        run: |
          if git diff --quiet -- data/deadlines.json docs/benchmarks/deprecation-pages; then
            echo 'The registry already matches every page that was read.'
            exit 0
          fi
          number="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          # The branch belongs to this workflow and is rebuilt from main on every run, unless a
          # person has pushed to it while its pull request is open.
          if [ -n "$number" ]; then
            git fetch -q --depth=1 origin "$BRANCH"
            if [ "$(git log -1 --format=%ae FETCH_HEAD)" != "$BOT_EMAIL" ]; then
              echo "::warning::$BRANCH has a commit from a person; it is left as it is. Merge or close pull request #$number to resume syncing."
              exit 0
            fi
          fi
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git switch -q -C "$BRANCH"
          git add docs/benchmarks/deprecation-pages && git commit -q -m "$TITLE" -- data/deadlines.json docs/benchmarks/deprecation-pages
          git push -q --force origin "$BRANCH"
          {
            cat <<'BODY'
          The scheduled registry sync (`.github/workflows/registry-sync.yml`) read the providers' deprecation pages and found changes for `data/deadlines.json`. Nothing is merged automatically.

          Before merging, compare each added or changed entry with its `source` page. Entries a page no longer lists are kept, never deleted. A model's replacement is named only where the page recommends a single model; check every other model entry by hand. See `docs/REGISTRY-SYNC.md`.

          This pull request was opened with `GITHUB_TOKEN`, so CI does not start on its own: close and reopen it to run the checks.

          BODY
            echo '```text'
            cat "$RUNNER_TEMP/sync.txt"
            echo '```'
            if [ -n "$FAILED" ]; then
              echo
              echo "Not synced on this run: $FAILED. The workflow log has each error."
            fi
          } > "$RUNNER_TEMP/body.md"
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$RUNNER_TEMP/body.md"
          elif ! gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"; then
            echo "::error::Could not open the pull request. Open it from https://github.com/$GITHUB_REPOSITORY/compare/main...$BRANCH, or allow GitHub Actions to create pull requests in the repository settings."
            exit 1
          fi
      - name: Fail when a page could not be synced
        if: steps.sync.outputs.failed != ''
        env:
          FAILED: ${{ steps.sync.outputs.failed }}
        run: |
          echo "::error::Not synced: $FAILED. The sync step's log has each error."
          exit 1
