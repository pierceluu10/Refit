name: Supply chain

on:
  pull_request:
  push:
    branches: [main]
  # Advisories are published without any code change, so check main weekly as well.
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: npm audit gate (high and critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Reads package-lock.json only; nothing is installed or run from dependencies.
      - run: node scripts/audit-gate.mjs
