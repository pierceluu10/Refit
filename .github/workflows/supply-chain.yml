name: Supply chain

on:
  pull_request:
  push:
    branches: [main]
  # Advisories are published without any code change, so check main weekly as well.
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: npm audit gate (high and critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Reads package-lock.json only; nothing is installed or run from dependencies.
      - run: node scripts/audit-gate.mjs
